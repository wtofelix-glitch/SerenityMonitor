<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Serenity — A股量化交易监控看板">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <title>Serenity</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/monitor-base.css') }}?v=7.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-' + theme + '.css') }}?v=7.0">
  <script async src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body>
  <a href="#tab-bar" class="sr-only focusable" aria-label="跳到主菜单">跳到导航</a>
  <header class="top-header">
    <div class="header-inner">
      <div class="header-brand"><div class="header-logo">S</div><span class="header-title">Serenity</span></div>
      <div class="header-meta">
        <span class="session-badge" id="session-badge">--</span>
        <span class="header-time" id="header-time" aria-live="polite">--</span>
        <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()" aria-label="刷新看板数据" title="刷新看板数据">⟳</button>
        <span class="status-dot"></span>
      </div>
    </div>
  </header>
  <nav class="tab-bar" role="tablist" aria-label="主导航">
    <button id="tab-button-overview" class="tab-btn active" data-tab="overview" role="tab" tabindex="0" aria-selected="true" aria-controls="tab-overview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>总览</span></button>
    <button id="tab-button-holdings" class="tab-btn" data-tab="holdings" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-holdings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="5" width="22" height="14" rx="3"/><line x1="4" y1="12" x2="20" y2="12"/></svg><span>持仓</span></button>
    <button id="tab-button-risk" class="tab-btn" data-tab="risk" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-risk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>风控</span></button>
    <button id="tab-button-sentinel" class="tab-btn" data-tab="sentinel" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-sentinel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="12" x2="16" y2="14"/></svg><span>哨兵</span></button>
    <button id="tab-button-operations" class="tab-btn" data-tab="operations" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-operations"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>运营</span></button>
    <button id="tab-button-live" class="tab-btn" data-tab="live" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-live"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>盯盘</span></button>
    <button id="tab-button-governance" class="tab-btn" data-tab="governance" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-governance"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>治理</span></button>
  </nav>
  <div class="market-bar" id="market-bar"><div class="index-row" id="index-row"><span class="idx-loading">⏳ 加载指数...</span></div><span class="idx-time" id="idx-time">--</span></div>
  <div class="tab-content active" id="tab-overview" role="tabpanel" aria-labelledby="tab-button-overview"><div class="dashboard-skeleton" aria-label="正在加载总览"><span></span><span></span><span></span></div></div>
  <div class="action-bar" id="action-bar" style="display:none">
    <button class="action-btn primary" onclick="refresh(true)">🔄 刷新数据</button>
    <button class="action-btn" onclick="try{navigator.clipboard.writeText(JSON.stringify(STATE.data?.portfolio_summary||{}));showToast('已复制持仓摘要','success')}catch(e){showToast('复制失败','error')}">📋 复制摘要</button>
    <span class="action-btn" id="refresh-status" style="cursor:default">⏱ 自动刷新</span>
  </div>
  <div class="tab-content" id="tab-holdings" role="tabpanel" aria-labelledby="tab-button-holdings" hidden></div>
  <div class="tab-content" id="tab-risk" role="tabpanel" aria-labelledby="tab-button-risk" hidden></div>
  <div class="tab-content" id="tab-sentinel" role="tabpanel" aria-labelledby="tab-button-sentinel" hidden></div>
  <div class="tab-content" id="tab-operations" role="tabpanel" aria-labelledby="tab-button-operations" hidden></div>
  <div class="tab-content" id="tab-live" role="tabpanel" aria-labelledby="tab-button-live" hidden></div>
  <div class="tab-content" id="tab-governance" role="tabpanel" aria-labelledby="tab-button-governance" hidden></div>
  <script src="{{ url_for('static', filename='js/monitor.js') }}?v=7.0"></script>
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
    }
  </script>
</body>
</html>
